- name: Delete a virtual machine
  hosts: localhost
  tasks:
    - name: Delete VM
      redhat.openshift.k8s:
        host: "{{ lookup('env', 'K8S_AUTH_HOST') }}"
        api_key: "{{ lookup('env', 'K8S_AUTH_API_KEY') }}"
        validate_certs: false
        state: absent
        template: ../templates/bklab-vm-delete.yml